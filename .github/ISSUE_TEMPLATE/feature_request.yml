name: Feature request
description: Suggest a mapping, apparel, export, or automation improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What are you trying to create or accomplish?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behavior
    validations:
      required: true
