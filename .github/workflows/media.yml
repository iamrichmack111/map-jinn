name: Screenshots and Demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'templates/**'
      - 'app.py'
      - 'tests/**'
      - 'scripts/record-demo.mjs'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/media.yml'

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg and Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Capture Playwright screenshots
        run: npm run screenshots

      - name: Record demo video
        run: npm run demo

      - name: Verify generated media
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/screenshots/01-login.png
          test -s docs/screenshots/02-workspace.png
          test -s docs/screenshots/03-footprint-map.png
          test -s demo/map-jinn-demo.mp4
          test "$(stat -c%s demo/map-jinn-demo.mp4)" -gt 10000
          ls -lh docs/screenshots/*.png demo/map-jinn-demo.mp4

      - name: Upload screenshots and demo
        uses: actions/upload-artifact@v4
        with:
          name: map-jinn-media
          path: |
            docs/screenshots/01-login.png
            docs/screenshots/02-workspace.png
            docs/screenshots/03-footprint-map.png
            demo/map-jinn-demo.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated media when branch permits it
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/01-login.png docs/screenshots/02-workspace.png docs/screenshots/03-footprint-map.png demo/map-jinn-demo.mp4
          if git diff --cached --quiet; then
            echo "Generated media is already current."
          else
            git commit -m "docs: refresh Playwright screenshots and demo video"
            git push
          fi
