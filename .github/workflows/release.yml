name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish or refresh
        required: true
        default: v17.4.5
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve tag
        id: rel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then TAG="$GITHUB_REF_NAME"; else TAG='${{ inputs.tag }}'; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.rel.outputs.tag }}
      - name: Verify source
        run: |
          test -s docs/architecture.svg
          test -s docs/architecture.d2
          python3 -m py_compile app.py
          node --check static/js/app.js
      - name: Build source release
        id: assets
        shell: bash
        run: |
          TAG='${{ steps.rel.outputs.tag }}'; ZIP="map-jinn-${TAG}.zip"
          git archive --format=zip --output="$ZIP" HEAD
          sha256sum "$ZIP" docs/architecture.svg > SHA256SUMS.txt
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG='${{ steps.rel.outputs.tag }}'; ZIP='${{ steps.assets.outputs.zip }}'
          if gh release view "$TAG" >/dev/null 2>&1; then gh release edit "$TAG" --title "Map Jinn ${TAG#v}" --notes-file RELEASE_NOTES.md; else gh release create "$TAG" --title "Map Jinn ${TAG#v}" --notes-file RELEASE_NOTES.md; fi
          gh release upload "$TAG" --clobber "$ZIP" SHA256SUMS.txt docs/architecture.svg
