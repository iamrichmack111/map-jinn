name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/screenshots/**'
      - 'demo/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax checks
        run: |
          python -m py_compile app.py
          node --check static/js/app.js
          node --check scripts/record-demo.mjs

      - name: Validate D2 architecture + custom icons
        run: |
          test -s docs/architecture.d2
          test -s docs/architecture.svg
          for f in docs/icons/browser.svg docs/icons/python.svg docs/icons/arcgis.svg docs/icons/footprints.svg docs/icons/playwright.svg docs/icons/docker.svg docs/icons/github-actions.svg docs/icons/ghcr.svg; do test -s "$f"; done

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npm test

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
